services:
  - type: web
    name: budget-bazzar
    runtime: python
    buildCommand: pip install -r requirements.txt
    startCommand: gunicorn deploy_app:app
    healthCheckPath: /api/health
    envVars:
      - key: BUDGET_BAZZAR_API_KEY
        sync: false
      - key: FLASK_SECRET_KEY
        generateValue: true
      - key: DATA_DIR
        value: /var/data
    disk:
      name: budget-bazzar-data
      mountPath: /var/data
      sizeGB: 1
